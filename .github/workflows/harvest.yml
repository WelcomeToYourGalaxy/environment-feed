name: Harvest the space front

on:
  schedule:
    - cron: "23 */2 * * *"     # every two hours, at :23
  workflow_dispatch:            # run by hand from the Actions tab
  push:
    paths:
      - "harvest_space.py"
      - "sources_space.json"
      - ".github/workflows/harvest.yml"

permissions:
  contents: write

concurrency:
  group: harvest-space
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read every wire and write wire_space.json
        run: python3 harvest_space.py

      - name: Commit if the feed changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wire_space.json
          if git diff --cached --quiet; then
            echo "No change to wire_space.json"
            exit 0
          fi
          COUNT=$(python3 -c "import json;print(json.load(open('wire_space.json'))['counts']['stories'])")
          git commit -m "wire: $COUNT stories ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected — main moved. Rebasing and retrying (attempt $attempt)."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done
          echo "Could not push after five attempts."
          exit 1
